name: z08studio-home

services:
  site:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    user: "65534:65534"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    # The official Caddy binary carries this file capability, even on a high port.
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 64m
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    volumes:
      - type: bind
        source: ${Z08_DEPLOY_ROOT:?Set Z08_DEPLOY_ROOT}/releases
        target: /srv/releases
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ${Z08_DEPLOY_ROOT}/config/Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
        bind: { create_host_path: false }
    networks:
      gateway:
        aliases: [z08studio-home]
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }

networks:
  gateway:
    external: true
    name: ${Z08_DOCKER_NETWORK:?Set Z08_DOCKER_NETWORK}
